# Entorno de PRUEBAS: base, caché, API y frontend. Levanta la tienda en local.
#
# Se puede recorrer una compra entera en el navegador porque el widget de
# Wompi está simulado: `scripts/wompi-widget-falso.mjs` sirve un `widget.js`
# con la misma forma que el real y, al elegir desenlace, firma el evento y se
# lo manda al webhook igual que haría Wompi. El sondeo del checkout no se
# simula: se ejerce de verdad.
#
# Lo que NO cubre es que tus llaves funcionen; para eso hace falta el sandbox
# real. Para confirmar un pago desde la terminal, sin navegador, está
# `scripts/wompi-falso.mjs`.
#
#     docker compose up --build
#
# Luego: http://localhost:5173  (landing)
#        http://localhost:5173/checkout.html
#        http://localhost:3000/api/docs
#
# ⚠️ ESTO NO SIRVE PARA PRODUCCIÓN, y no por descuido:
#    - los secretos están aquí escritos, a la vista;
#    - las credenciales de pago son de ejemplo y no cobran nada;
#    - el frontend corre en modo desarrollo, sin compilar;
#    - `CORS_ORIGIN` es `*`.
#    El backend se niega a arrancar con esta configuración si se le pone
#    NODE_ENV=production (ver `shared/config/env.ts`), que es justo la red
#    de seguridad que evita desplegar esto por error.
#
# Para desplegar de verdad hay otro punto de partida: `backend/docker-compose.yml`
# levanta solo la API contra Postgres y Redis, leyendo las credenciales
# reales de `backend/.env`.

name: pomass-pruebas

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pomass
      POSTGRES_PASSWORD: pomass_pass
      POSTGRES_DB: pomass
    ports:
      # 15432 y no 5432: en esta máquina hay un Postgres nativo ocupando el
      # puerto estándar, y las conexiones desde fuera acababan en él en vez de
      # aquí, fallando con un error de credenciales que no decía nada de eso.
      # Tampoco 55432, el que había antes: Windows reserva rangos dinámicos
      # para Hyper-V (55334-55433 entre ellos) y, al reiniciar Docker, el
      # arranque moría con «ports are not available ... forbidden by its
      # access permissions». 15432 queda fuera de esos rangos.
      # La API no usa este puerto: dentro de compose habla con `db:5432`.
      # Para psql, Prisma Studio o los tests de integración: localhost:15432.
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomass -d pomass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Desarrollo a propósito: con `production` el backend rechazaría medio
      # archivo de estos (secretos de ejemplo, CORS abierto, token de prueba).
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: /api

      # Dentro de la red de compose los hosts son los nombres de servicio.
      DATABASE_URL: postgresql://pomass:pomass_pass@db:5432/pomass?schema=public
      # Sin pooler en local: la conexión directa es la misma. Prisma la exige
      # porque el schema declara `directUrl` (ver schema.prisma).
      DIRECT_URL: postgresql://pomass:pomass_pass@db:5432/pomass?schema=public
      REDIS_URL: redis://redis:6379

      JWT_ACCESS_SECRET: secreto_de_pruebas_no_usar_en_produccion
      CORS_ORIGIN: "*"

      # URL del frontend tal y como la ve el NAVEGADOR, no la red de compose:
      # de aquí salen los enlaces de los correos y la vuelta tras pagar.
      FRONTEND_URL: http://localhost:5173

      # --- Wompi ---
      PAYMENTS_SANDBOX: "true"
      # No es la de ceros a propósito: con esa, el checkout se declara «sin
      # configurar» y ni intenta abrir el widget. Esta no vale en Wompi, pero
      # aquí quien atiende es el widget simulado.
      WOMPI_PUBLIC_KEY: pub_test_simulacion_local
      WOMPI_PRIVATE_KEY: prv_test_000000000000000000000000
      WOMPI_INTEGRITY_SECRET: dev_wompi_integrity_change_me
      # Este importa aunque no haya widget: es el secreto con el que
      # `scripts/wompi-falso.mjs` firma los eventos de prueba. Si los dos no
      # coinciden, el webhook responde 401.
      WOMPI_EVENTS_SECRET: dev_wompi_events_change_me
      # A dónde vuelve la clienta tras pagar. Lo abre el NAVEGADOR, así que
      # es localhost y no un nombre de servicio de compose.
      WOMPI_REDIRECT_URL: http://localhost:5173/track.html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migra, siembra el catálogo y arranca.
    command: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/main.js"

  # Las pruebas, dentro de Docker y contra la misma base y caché que la API.
  #
  # No se levanta con `up`: está bajo un perfil, así que solo corre cuando se
  # pide a mano. Existe para que los tests de integración no dependan de que
  # el host tenga Postgres, Redis ni las variables apuntando al sitio correcto
  # — que era justo lo que los dejaba sin correr.
  #
  #     docker compose run --rm tests                    # toda la suite
  #     docker compose run --rm tests npm run test:unit  # solo los unitarios
  #     docker compose run --rm tests npx jest -t "cupón" # un caso suelto
  tests:
    build:
      context: ./backend
      target: tester
    profiles: ["test"]
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://pomass:pomass_pass@db:5432/pomass?schema=public
      DIRECT_URL: postgresql://pomass:pomass_pass@db:5432/pomass?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: secreto_de_pruebas_no_usar_en_produccion
      # Los de la plantilla: los tests de pagos firman con ellos.
      WOMPI_INTEGRITY_SECRET: dev_wompi_integrity_change_me
      WOMPI_EVENTS_SECRET: dev_wompi_events_change_me
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Migra antes: los de integración necesitan el esquema al día, y aplicar
    # migraciones es idempotente si la API ya lo hizo.
    command: sh -c "npx prisma migrate deploy && npm test"

  # El widget de Wompi, simulado. Ver `backend/scripts/wompi-widget-falso.mjs`.
  wompi:
    # Un script suelto sobre la imagen de Node: no merece Dockerfile propio.
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    ports:
      - "4100:4100"
    volumes:
      - ./backend/scripts:/app/scripts:ro
    environment:
      PUERTO: 4100
      # Lo llama este contenedor, no el navegador: nombre de servicio.
      BACKEND_URL: http://api:3000
      # Tiene que coincidir con el de la API o el webhook responde 401.
      WOMPI_EVENTS_SECRET: dev_wompi_events_change_me
    command: node scripts/wompi-widget-falso.mjs

  frontend:
    image: node:20-alpine
    restart: unless-stopped
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      # Volumen propio para `node_modules`: las dependencias nativas que se
      # instalan en Linux no son las mismas que las del Windows de fuera, y
      # sin esto el montaje de `./frontend` las pisaría.
      - frontend_node_modules:/app/node_modules
    environment:
      # La ve el navegador, así que es localhost y no el nombre del servicio.
      VITE_API_URL: http://localhost:3000/api
      # Lo carga el NAVEGADOR, así que localhost y no el nombre del servicio.
      # Sin esta variable se cargaría el widget real de Wompi.
      VITE_WOMPI_WIDGET_URL: http://localhost:4100/widget.js
      # Dentro de un contenedor no hay navegador que abrir.
      VITE_NO_OPEN: "true"
    # `--no-save`: al instalar en Linux, npm añade al lockfile los binarios
    # nativos de esta plataforma. Sin esto, levantar el stack dejaba
    # `package-lock.json` modificado en el repo, que no es asunto suyo.
    command: sh -c "npm install --no-save && npm run dev -- --host 0.0.0.0"

volumes:
  pgdata:
  frontend_node_modules:

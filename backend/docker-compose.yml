services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # Dentro de la red de compose los hosts son los nombres de servicio
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      # Sin pooler en local: la conexión directa es la misma. Prisma la exige
      # porque el schema declara `directUrl` (ver schema.prisma).
      DIRECT_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Aplica migraciones, siembra datos (seed compilado) y arranca la API
    command: sh -c "npx prisma migrate deploy && node dist/prisma/seed.js && node dist/main.js"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Solo en loopback: así se puede entrar con `psql` por un túnel SSH desde
    # fuera, pero el puerto no queda abierto a toda la red/internet. El `api`
    # igual le llega por dentro de la red de compose, sin pasar por aquí.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Redis no pide usuario/contraseña por defecto: sin `requirepass`, abrir
    # el puerto (aunque fuera solo a loopback) dejaría leer y borrar toda la
    # caché a cualquiera con acceso a esta máquina.
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Mismo razonamiento que en `db`: solo loopback, nunca la red pública.
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
